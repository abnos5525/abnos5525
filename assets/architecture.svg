<svg xmlns="http://www.w3.org/2000/svg" width="870" height="270" viewBox="0 0 870 270" role="img" aria-label="Architecture: browser to Next.js to Kong gateway to NestJS and Spring services, with Keycloak, Kafka, PostgreSQL and Redis">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
    <style>
      text { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; }
      .t { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .s { fill: #8b949e; font-size: 11px; }
      .node { fill: #161b22; stroke: #30363d; }
      .wire { fill: none; stroke: #30363d; stroke-width: 1.5; }
      .flow { fill: none; stroke: #5eead4; stroke-width: 1.5; stroke-dasharray: 4 10; opacity: 0.55; animation: flow 1.1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 1; } }
      .grid { stroke: #161b22; stroke-width: 1; }
    </style>
  </defs>

  <rect x="1" y="1" width="868" height="268" rx="14" fill="#0d1117" stroke="#30363d" />
  <g class="grid">
    <path d="M0 45H870M0 90H870M0 135H870M0 180H870M0 225H870" />
    <path d="M87 0V270M174 0V270M261 0V270M348 0V270M435 0V270M522 0V270M609 0V270M696 0V270M783 0V270" />
  </g>

  <path id="w1" class="wire" d="M162 140 H200" />
  <path id="w2" class="wire" d="M332 140 H370" />
  <path id="w3" class="wire" d="M436 113 V82" />
  <path id="w4" class="wire" d="M502 140 H540" />
  <path id="w5" class="wire" d="M672 128 C692 128 690 77 710 77" />
  <path id="w6" class="wire" d="M672 152 C692 152 690 203 710 203" />
  <use href="#w1" class="flow" />
  <use href="#w2" class="flow" />
  <use href="#w3" class="flow" />
  <use href="#w4" class="flow" />
  <use href="#w5" class="flow" />
  <use href="#w6" class="flow" />

  <g filter="url(#glow)" fill="#5eead4">
    <circle r="3.5"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0s"><mpath href="#w1" /></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0.35s"><mpath href="#w2" /></animateMotion></circle>
    <circle r="3" fill="#a78bfa"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.5s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w3" /></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0.7s"><mpath href="#w4" /></animateMotion></circle>
    <circle r="3.5" fill="#fbbf24"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1s"><mpath href="#w5" /></animateMotion></circle>
    <circle r="3.5" fill="#60a5fa"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.2s"><mpath href="#w6" /></animateMotion></circle>
  </g>

  <g>
    <rect class="node" x="30" y="113" width="132" height="54" rx="10" />
    <text class="t" x="96" y="137" text-anchor="middle">Browser</text>
    <text class="s" x="96" y="155" text-anchor="middle">RTL &#183; a11y &#183; SSR</text>
  </g>
  <g>
    <rect class="node" x="200" y="113" width="132" height="54" rx="10" />
    <text class="t" x="266" y="137" text-anchor="middle">Next.js</text>
    <text class="s" x="266" y="155" text-anchor="middle">React &#183; TypeScript</text>
  </g>
  <g>
    <rect class="node" x="370" y="113" width="132" height="54" rx="10" />
    <text class="t" x="436" y="137" text-anchor="middle">Kong</text>
    <text class="s" x="436" y="155" text-anchor="middle">API gateway</text>
  </g>
  <g>
    <rect class="node" x="370" y="28" width="132" height="54" rx="10" stroke="#a78bfa" stroke-opacity="0.6" />
    <text class="t" x="436" y="52" text-anchor="middle">Keycloak</text>
    <text class="s" x="436" y="70" text-anchor="middle">OIDC &#183; JWT &#183; RBAC</text>
  </g>
  <g>
    <rect x="540" y="108" width="132" height="64" rx="10" fill="url(#core)" stroke="#5eead4" class="pulse" stroke-width="1.5" />
    <text class="t" x="606" y="134" text-anchor="middle">NestJS</text>
    <text class="t" x="606" y="152" text-anchor="middle" style="font-size:12px">Spring Boot</text>
    <text class="s" x="606" y="166" text-anchor="middle">REST &#183; gRPC</text>
  </g>
  <g>
    <rect class="node" x="710" y="50" width="132" height="54" rx="10" stroke="#fbbf24" stroke-opacity="0.55" />
    <text class="t" x="776" y="74" text-anchor="middle">Kafka</text>
    <text class="s" x="776" y="92" text-anchor="middle">events &#183; RabbitMQ</text>
  </g>
  <g>
    <rect class="node" x="710" y="176" width="132" height="54" rx="10" stroke="#60a5fa" stroke-opacity="0.55" />
    <text class="t" x="776" y="200" text-anchor="middle">PostgreSQL</text>
    <text class="s" x="776" y="218" text-anchor="middle">Redis cache &#183; JPA</text>
  </g>

  <text class="s" x="30" y="252">one typed contract &#8212; from the first screen to storage</text>
  <circle cx="830" cy="248" r="4" fill="#34d399"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" /></circle>
  <text class="s" x="818" y="252" text-anchor="end">all systems operational</text>
</svg>
